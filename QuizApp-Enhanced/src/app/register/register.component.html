<div class="auth-page">
  <div class="auth-bg">
    <div class="auth-orb orb-a"></div>
    <div class="auth-orb orb-b"></div>
  </div>
  <div class="container auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">🚀</div>
        <h2 class="auth-title">Join the Arena</h2>
        <p class="auth-subtitle">Create your account and start competing</p>
      </div>

      @if (error()) {
        <div class="alert-custom alert-error">⚠️ {{ error() }}</div>
      }

      <form (ngSubmit)="onRegister()">
        <div class="field-group">
          <label class="field-label">Full Name</label>
          <div class="field-wrap">
            <span class="field-icon">✨</span>
            <input type="text" class="field-input" [(ngModel)]="name" name="name" placeholder="Your display name" />
          </div>
        </div>
        <div class="field-group">
          <label class="field-label">Username</label>
          <div class="field-wrap">
            <span class="field-icon">👤</span>
            <input type="text" class="field-input" [(ngModel)]="username" name="username" placeholder="Choose a username" required />
          </div>
        </div>
        <div class="field-group">
          <label class="field-label">Email</label>
          <div class="field-wrap">
            <span class="field-icon">📧</span>
            <input type="email" class="field-input" [(ngModel)]="email" name="email" placeholder="your@email.com" required />
          </div>
        </div>
        <div class="field-group">
          <label class="field-label">Password</label>
          <div class="field-wrap">
            <span class="field-icon">🔑</span>
            <input [type]="showPass() ? 'text' : 'password'" class="field-input" [(ngModel)]="password" name="password" placeholder="Min. 6 characters" required />
            <button type="button" class="toggle-pass" (click)="showPass.set(!showPass())">{{ showPass() ? '🙈' : '👁️' }}</button>
          </div>
        </div>
        <div class="field-group">
          <label class="field-label">I want to...</label>
          <div class="role-selector">
            <button type="button" class="role-btn" [class.active]="role === 'Taker'" (click)="role = 'Taker'">
              <span class="role-icon">🎯</span>
              <span class="role-name">Quiz Taker</span>
              <span class="role-desc">Play & compete</span>
            </button>
            <button type="button" class="role-btn" [class.active]="role === 'Creator'" (click)="role = 'Creator'">
              <span class="role-icon">✏️</span>
              <span class="role-name">Quiz Creator</span>
              <span class="role-desc">Build quizzes</span>
            </button>
            <button type="button" class="role-btn" [class.active]="role === 'Evaluator'" (click)="role = 'Evaluator'">
              <span class="role-icon">📋</span>
              <span class="role-name">Evaluator</span>
              <span class="role-desc">Review & grade</span>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-auth" [disabled]="loading()">
          @if (loading()) {
            <span class="spinner"></span> Creating account...
          } @else {
            Create Account
          }
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a routerLink="/login">Sign in</a>
      </div>
    </div>
  </div>
</div>
