<div class="ud-page">
  <div class="ud-bg">
    <div class="ud-orb ud-orb-1"></div>
    <div class="ud-orb ud-orb-2"></div>
  </div>
  <div class="container ud-container">
    <div class="ud-header">
      <a routerLink="/profile" class="back-link">← Back to Profile</a>
      <h1 class="ud-title">User Details</h1>
    </div>

    @if (success()) {
      <div class="alert-ok">✅ {{ success() }}</div>
    }
    @if (error()) {
      <div class="alert-err">⚠️ {{ error() }}</div>
    }

    <div class="ud-card">
      <div class="ud-avatar">
        {{ auth.currentUser()?.username?.charAt(0)?.toUpperCase() }}
      </div>
      <h2 class="ud-username">{{ auth.currentUser()?.username }}</h2>
      <span class="ud-role">{{ auth.currentUser()?.role }}</span>

      <form class="ud-form" (ngSubmit)="onSave()">
        <div class="form-row">
          <div class="field-group">
            <label class="field-label">Full Name</label>
            <input type="text" class="field-input" [(ngModel)]="form.name" name="name" placeholder="Your full name" />
          </div>
          <div class="field-group">
            <label class="field-label">Phone Number</label>
            <input type="tel" class="field-input" [(ngModel)]="form.phoneNumber" name="phone" placeholder="+91 XXXXX XXXXX" />
          </div>
        </div>
        <div class="field-group">
          <label class="field-label">Address Line 1</label>
          <input type="text" class="field-input" [(ngModel)]="form.addressLine1" name="addr1" placeholder="Street address" />
        </div>
        <div class="field-group">
          <label class="field-label">Address Line 2</label>
          <input type="text" class="field-input" [(ngModel)]="form.addressLine2" name="addr2" placeholder="Apt, Suite, Floor (optional)" />
        </div>
        <div class="form-row">
          <div class="field-group">
            <label class="field-label">City</label>
            <input type="text" class="field-input" [(ngModel)]="form.city" name="city" placeholder="City" />
          </div>
          <div class="field-group">
            <label class="field-label">State</label>
            <input type="text" class="field-input" [(ngModel)]="form.state" name="state" placeholder="State" />
          </div>
        </div>
        <div class="field-group" style="max-width: 200px;">
          <label class="field-label">Pincode</label>
          <input type="text" class="field-input" [(ngModel)]="form.pincode" name="pin" placeholder="000000" />
        </div>
        <button type="submit" class="btn-save" [disabled]="saving()">
          @if (saving()) {
            <span class="spinner"></span> Saving...
          } @else {
            Save Details
          }
        </button>
      </form>
    </div>
  </div>
</div>
